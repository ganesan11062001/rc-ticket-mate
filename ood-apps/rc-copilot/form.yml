---
cluster: explorer

form:
  - bc_num_hours
  - partition
  - gpu_layout
  - rc_model

attributes:
  bc_num_hours:
    widget: number_field
    label: "Hours"
    value: 1
    min: 1
    max: 8
    step: 1
    help: >-
      Capped by the partition: gpu-interactive and gpu-short allow 2 hours,
      gpu allows 8. The box tightens itself when you change partition. The
      model takes a few minutes to load, so a 1-hour session gives roughly
      50 minutes of drafting.

  partition:
    widget: select
    label: "Partition"
    value: "gpu-interactive"
    options:
      - [ "gpu-interactive - for OOD sessions (recommended)", "gpu-interactive",
          data-max-bc-num-hours: 2 ]
      - [ "gpu-short - 2 h, higher priority", "gpu-short",
          data-max-bc-num-hours: 2 ]
      - [ "gpu - up to 8 h, longer queue", "gpu",
          data-max-bc-num-hours: 8 ]
      - [ "multigpu - needs approval, required for 2+ GPUs", "multigpu",
          data-max-bc-num-hours: 24 ]
    help: >-
      gpu-interactive is the partition RC documents for Open OnDemand sessions.
      All the general-access GPU partitions allow only ONE GPU per job; 2 or
      more requires multigpu, which needs prior approval.
      See https://rc.northeastern.edu/partitions

  gpu_layout:
    widget: select
    label: "GPUs"
    value: "t4"
    options:
      - ["1 x T4 16GB - available now, 4-bit models (recommended)", "t4"]
      - ["1 x A100 80GB - 32K context, full-precision GLM", "1x80"]
      - ["1 x A100 40GB - up to Qwen2.5-7B at fp16", "1x40"]
      - ["2 x A100 - 131K context, needs multigpu approval", "2x"]
      - ["4 x A100 - GLM-4.5-Air, needs multigpu approval", "4x"]
    help: >-
      A100s are heavily contended here; the single T4 node (d1025) is usually
      free. vLLM permits AWQ 4-bit from sm_75, which a T4 is, so a 4-bit 7B fits
      in 16 GB with room for KV cache. Pick an A100 only if you need
      full-precision GLM. Never V100 - torch has no sm_70 kernels.

  rc_model:
    widget: select
    label: "Model"
    value: "t4-7b"
    options:
      - ["Qwen2.5-7B AWQ - 4-bit, runs on a T4 (recommended)", "t4-7b"]
      - ["Qwen2.5-14B AWQ - 4-bit, T4 but tight, 8K context", "t4-14b"]
      - ["Qwen2.5-3B - smoke test only, weakest drafts", "small"]
      - ["Qwen2.5-7B fp16 - needs an A100 40GB", "qwen7b"]
      - ["GLM-4.7-Flash (30B MoE) - needs an A100 80GB", "flash"]
      - ["GLM-4.5-Air (106B) - 4 GPUs, multigpu approval", "air"]
    help: >-
      The AWQ builds are 4-bit and fit a T4; the fp16 and GLM builds need an
      A100. Choosing a model that does not fit the GPU you picked will be
      rejected at submission rather than after the queue wait. Qwen2.5-3B is
      only for proving the pipeline - its drafts are noticeably weaker.
